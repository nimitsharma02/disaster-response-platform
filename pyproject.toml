[project]
name = "disaster-response-platform"
version = "1.0.0"
description = "Backend-focused disaster response coordination platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.15.2",
    "shapely>=2.0.6",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "httpx>=0.27.2",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "structlog>=24.4.0",
    "arq>=0.26.1",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# An asyncpg pool belongs to the event loop that created it. Tests run on a
# per-function loop, so the fixtures that open connections must run on that SAME
# loop - otherwise SQLAlchemy raises "got Future attached to a different loop".
# Hence "function" here. The one genuinely session-scoped fixture
# (tests/conftest.py::_create_schema) opts into the session loop explicitly and
# disposes its engine before any test runs.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults is the documented idiom
    "UP046",  # PEP 695 `class C[T]` - Generic[T] is kept for Pydantic generic models
    "UP047",  # PEP 695 generic functions - same reason, kept consistent with the above
]
